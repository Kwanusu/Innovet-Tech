<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Innovet Tech for bespoke corporate solutions.">
    <title>Contact Us | Innovet Tech</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="contact-page">

    <header class="main-header">
        <div class="container header-content">
            <div class="logo-wrapper">
                <div class="logo-icon-box">
                    <img src="images/logo.png" alt="Innovet Tech Logo">
                </div>
                <span class="logo-text">Innovet<span class="accent-light">Tech</span></span>
            </div>

            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </label>

            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link active">About</a></li>
                    <li><a href="services.html" class="nav-link">Services</a></li>
                    <li><a href="team.html" class="nav-link">Team</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
            <div class="menu-overlay"></div>
        </div>
    </header>

    <main class="contact-section">
        <div class="container">
            <div class="contact-card">
                <div class="contact-sidebar">
                    <h2 class="sidebar-title">Secure a Consultation.</h2>
                    <div class="sidebar-info">
                        <div>
                            <span class="overline">Global HQ</span>
                            <p class="info-body">The Times Tower, Suite 100<br>Nairobi, Kenya</p>
                        </div>
                        <div>
                            <span class="overline">Digital</span>
                            <p class="info-body">support@innovettech.co.ke</p>
                        </div>
                    </div>
                </div>

                <div class="form-area">
                    <form action="#" class="contact-form">
                        <div class="form-grid">
                            <div class="input-wrapper">
                                <label for="name" class="input-label">Full Name</label>
                                <input type="text" id="name" required class="form-input" placeholder="John Doe">
                            </div>
                            <div class="input-wrapper">
                                <label for="email" class="input-label">Enterprise Email</label>
                                <input type="email" id="email" required class="form-input" placeholder="email@company.com">
                            </div>
                        </div>
                        <div class="input-wrapper">
                            <label for="msg" class="input-label">Project Vision</label>
                            <textarea id="msg" rows="4" required class="form-input" placeholder="Tell us about your objectives..."></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Initiate Connection</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Innovet Tech. All Rights Reserved.</p>
    </footer>

</body>
</html>
